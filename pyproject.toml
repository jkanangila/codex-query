[build-system]
requires = ["uv_build>=0.8,<0.9"]
build-backend = "uv_build"

# ------------------------------------------------------------------------------
# Project Metadata
# ------------------------------------------------------------------------------
[project]
name = "codex-query"
version = "0.1.0"
description = "Offline EPUB RAG for private local book collections using ChromaDB and Ollama."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  # Database & ORM
  "aiosqlite>=0.22.1",
  "alembic>=1.20.0",
  "asyncpg>=0.31.0",
  "sqlalchemy[asyncio]>=2.0.54",
  "sqlmodel>=0.0.47",

  # Document & EPUB Parsing
  "beautifulsoup4>=4.13",
  "ebooklib>=0.18",

  # Interface & UI
  "click>=8.1",
  "flet>=0.80",
  "questionary>=2.1",
  "rich>=14.0",

  # Core Utilities, Networking & Security
  "cryptography>=50.0.2",
  "httpx>=0.28.1",
  "keyring>=25.7.0",
  "numpy>=2.5.3",
  "platformdirs>=4.12.1",
  "pydantic-settings>=2.15.0",
]

[project.optional-dependencies]
desktop = ["chromadb>=1.0"]

[project.scripts]
codex-query = "codex_query.presentation.cli:main"
codex-query-ui = "codex_query.presentation.ui:main"
cli = "codex_query.presentation.cli:main"
ui = "codex_query.presentation.ui:main"

# ------------------------------------------------------------------------------
# Dependency Groups
# ------------------------------------------------------------------------------
[dependency-groups]
dev = [
  # Testing
  "anyio>=4.15.1",
  "faker>=40.41.0",
  "pytest>=8.4",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=6.2",

  # Linting & Type Checking
  "basedpyright>=1.31",
  "ruff>=0.13",

  # Interactive Development
  "ipykernel>=7.3.0",
  "jupyter-client>=8.10.0",
  "jupytext>=1.19.5",
  "pynvim>=0.6.0",
]

# ------------------------------------------------------------------------------
# Tool Configurations
# ------------------------------------------------------------------------------
[tool.uv]
default-groups = ["dev"]

[tool.uv.build-backend]
module-name = "codex_query"
module-root = "src"

[tool.flet]
org = "codex_query"
product = "Offline EPUB RAG"
app.path = "src/codex_query/presentation/ui"

[tool.ruff]
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ANN", "RUF"]
ignore = ["ANN401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportAbstractUsage = "error"
reportImplicitAbstractClass = "error"
reportImplicitOverride = "warning"
reportImportCycles = "error"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
