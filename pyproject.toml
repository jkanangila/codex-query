[project]
name = "codex-query"
version = "0.1.0"
description = "Offline EPUB RAG for private local book collections using ChromaDB and Ollama."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.22.1",
  "alembic>=1.20.0",
  "asyncpg>=0.31.0",
  "beautifulsoup4>=4.13",
  "chromadb>=1.1.0",
  "click>=8.1",
  "cryptography>=50.0.2",
  "ebooklib>=0.18",
  "flet>=0.80",
  "keyring>=25.7.0",
  "ollama>=0.6",
  "platformdirs>=4.12.1",
  "pydantic-settings>=2.15.0",
  "questionary>=2.1",
  "rich>=14.0",
  "sqlalchemy[asyncio]>=2.0.54",
  "sqlmodel>=0.0.47",
]

[project.scripts]
codex-query = "codex_query.presentation.cli:main"
codex-query-ui = "codex_query.presentation.ui:main"
cli = "codex_query.presentation.cli:main"
ui = "codex_query.presentation.ui:main"

[dependency-groups]
dev = [
  "anyio>=4.15.1",
  "basedpyright>=1.31",
  "ipykernel>=7.3.0",
  "jupyter-client>=8.10.0",
  "jupytext>=1.19.5",
  "pynvim>=0.6.0",
  "pytest>=8.4",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=6.2",
  "pytest-tornasync>=0.6.0.post2",
  "pytest-trio>=0.8.0",
  "pytest-twisted>=1.14.3",
  "ruff>=0.13",
  "twisted>=26.4.0",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["uv_build>=0.8,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "codex_query"
module-root = "src"

[tool.flet]
org = "codex_query"
product = "Offline EPUB RAG"
app.path = "src/codex_query/presentation/ui"

[tool.ruff]
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ANN", "RUF"]
ignore = ["ANN401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportAbstractUsage = "error"
reportImplicitAbstractClass = "error"
reportImplicitOverride = "warning"
reportImportCycles = "error"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
