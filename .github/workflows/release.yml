name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      should_release: ${{ steps.v.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: v
        run: |
          VERSION=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-latest, command: windows }
          - { name: linux, os: ubuntu-latest, command: linux }
          - { name: macos, os: macos-latest, command: macos }
          - { name: android, os: ubuntu-latest, command: apk }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv python install 3.12

      - name: Linux build dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake git ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev

      - name: Java (Android)
        if: matrix.name == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Decode Android keystore
        if: matrix.name == 'android'
        shell: bash
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Add desktop-only dependencies
        if: matrix.name != 'android'
        shell: bash
        run: uv add --no-sync "chromadb>=1.5.9" "asyncpg>=0.31.0"

      - name: Build
        shell: bash
        run: uv run --no-dev --with flet flet build ${{ matrix.command }} --yes -v
        env:
          PYTHONIOENCODING: utf-8
          FLET_ANDROID_SIGNING_KEY_STORE: ${{ runner.temp }}/release.jks
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      - name: Package
        shell: bash
        run: |
          VERSION=${{ needs.prepare.outputs.version }}
          mkdir -p dist
          case "${{ matrix.name }}" in
            windows) (cd build/windows && 7z a -tzip "../../dist/codex-query-$VERSION-windows.zip" .) ;;
            linux)   tar -czf "dist/codex-query-$VERSION-linux.tar.gz" -C build/linux . ;;
            macos)   ditto -c -k --sequesterRsrc --keepParent build/macos/*.app "dist/codex-query-$VERSION-macos.zip" ;;
            android) for f in build/apk/*.apk; do
                       cp "$f" "dist/codex-query-$VERSION-android-$(basename "$f")"
                     done ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Codex Query v${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          files: dist/*
