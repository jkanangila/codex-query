name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; only the release job gets write access.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    # Never release from a feature branch via workflow_dispatch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      should_release: ${{ steps.v.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: v
        run: |
          VERSION=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "Tag v$VERSION already exists; nothing to release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Fail fast, before spending four platform builds.
          if [ ! -f ".github/release-notes/v$VERSION.md" ]; then
            echo "::error::Missing .github/release-notes/v$VERSION.md"
            exit 1
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-latest, command: windows, args: "" }
          - { name: linux, os: ubuntu-latest, command: linux, args: "" }
          - {
              name: macos,
              os: macos-latest,
              command: macos,
              args: "--arch arm64",
            }
          - { name: android, os: ubuntu-latest, command: apk, args: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv python install 3.12

      - name: Linux build dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake git ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev

      - name: Java (Android)
        if: matrix.name == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Decode Android keystore
        if: matrix.name == 'android'
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      # Desktop-only deps (chromadb, asyncpg) come from
      # [tool.flet.<platform>].dependencies in pyproject.toml, so no
      # `uv add` step is needed (and CI no longer mutates pyproject/uv.lock).
      #
      # If `flet build` is not found, add "flet-cli" to the dev group.
      - name: Build
        shell: bash
        run: uv run --locked --no-dev flet build ${{ matrix.command }} ${{ matrix.args }} --build-number ${{ github.run_number }} --yes -v
        env:
          PYTHONIOENCODING: utf-8
          FLET_ANDROID_SIGNING_KEY_STORE: ${{ runner.temp }}/release.jks
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      - name: Package
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.name }}
        run: |
          set -euo pipefail
          ROOT="$PWD"
          DIST="$ROOT/dist"
          NAME="codex-query-$VERSION"
          mkdir -p "$DIST"

          # Stage into a named top-level folder so archives don't spray
          # files into the user's current directory when extracted.
          stage() {
            rm -rf "$ROOT/stage"
            mkdir -p "$ROOT/stage/$NAME"
            cp -R "$1"/. "$ROOT/stage/$NAME/"
          }

          case "$TARGET" in
            windows)
              stage build/windows
              (cd "$ROOT/stage" && 7z a -tzip "$DIST/$NAME-windows.zip" "$NAME")
              ;;
            linux)
              stage build/linux
              tar -czf "$DIST/$NAME-linux.tar.gz" -C "$ROOT/stage" "$NAME"
              ;;
            macos)
              ditto -c -k --sequesterRsrc --keepParent build/macos/*.app "$DIST/$NAME-macos.zip"
              ;;
            android)
              for f in build/apk/*.apk; do
                cp "$f" "$DIST/$NAME-android-$(basename "$f")"
              done
              ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Created as a draft: the tag only appears once publishing succeeds,
      # so a failed upload can't leave a tagged, broken release that makes
      # every later run skip.
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Codex Query v${{ needs.prepare.outputs.version }}
          body_path: .github/release-notes/v${{ needs.prepare.outputs.version }}.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "v$VERSION" --draft=false --repo "${{ github.repository }}"
