name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra desktop --locked

      - name: Ruff
        run: uv run ruff check .

      - name: Formatting
        run: uv run ruff format --check .

      - name: Type checking
        run: uv run basedpyright

      - name: Tests
        run: uv run pytest
